<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>MT3 扒谱</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>MT3 扒谱<span class="sub">音频 → MIDI</span></h1>
    <div class="pills">
      <span class="pill" id="devicePill">设备：…</span>
      <span class="pill" id="versionPill"></span>
    </div>
  </header>

  <section class="panel">
    <div class="drop" id="drop" tabindex="0" role="button"
         aria-label="选择音频文件">
      <strong>把音频拖到这里</strong>
      <span>或点击选择文件，可以一次选多个</span>
      <span class="muted" id="formats">wav / mp3 / flac / ogg / m4a / aac / aiff / opus</span>
      <input type="file" id="file" multiple hidden
             accept=".wav,.mp3,.flac,.ogg,.m4a,.aac,.aiff,.aif,.opus,audio/*">
    </div>

    <details class="options" id="options" open>
      <summary>转谱选项</summary>
      <div class="optgrid">
        <label class="field">模型
          <select id="model"></select>
        </label>
        <label class="check">
          <input type="checkbox" id="rearrange"> 转谱后整理 MIDI
        </label>
        <label class="field">力度阈值（≤ 即删除）
          <input type="number" id="velocity" min="0" max="127" step="1" value="30">
        </label>
        <label class="field">最小时值（毫秒）
          <input type="number" id="minMs" min="0" step="1" value="30">
        </label>
        <label class="field">琶音整合窗口（毫秒）
          <input type="number" id="chordMs" min="0" step="1" value="60">
        </label>
        <label class="field">连续消除窗口（毫秒）
          <input type="number" id="repeatMs" min="0" step="1" value="120">
        </label>
        <label class="check">
          <input type="checkbox" id="drums"> 连打击乐通道一起整理
        </label>
      </div>
      <p class="hint" id="rearrangeHint"></p>
    </details>

    <div class="actions">
      <button class="primary" id="start" disabled>上传并开始</button>
      <button id="abortUpload" hidden>取消上传</button>
      <span class="muted" id="uploadStatus"></span>
    </div>
    <progress id="uploadProgress" max="100" value="0" hidden></progress>
  </section>

  <section>
    <h2>任务 <span class="pill" id="queuePill"></span></h2>
    <ul class="jobs" id="jobs"></ul>
    <p class="muted" id="emptyJobs" hidden>还没有任务。</p>
  </section>

  <footer id="limits"></footer>
</div>
<script src="/static/app.js"></script>
</body>
</html>
