name: Build and release packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static checks
        run: |
          python -m py_compile gui/*.py
          python -m compileall -q mt3
          bash -n gui/*.sh packaging/*.sh
      - name: Check downloader
        run: python gui/download_checkpoints.py --models ismir2021 --list

  deb:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build Debian package
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot
          VERSION="${GITHUB_REF_NAME#v}" ./packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mt3-transcriber-deb
          path: dist/*.deb

  rpm:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build RPM package
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm bash coreutils
          VERSION="${GITHUB_REF_NAME#v}" ./packaging/build-rpm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mt3-transcriber-rpm
          path: dist/*.rpm

  appimage:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates file
      - name: Build AppImage
        run: VERSION="${GITHUB_REF_NAME#v}" ./packaging/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mt3-transcriber-appimage
          path: dist/*.AppImage
          retention-days: 14

  docker:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: mt3-transcriber:${{ github.sha }}
          push: false

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb, rpm, appimage]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
