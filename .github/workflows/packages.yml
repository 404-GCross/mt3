name: Build and release packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static checks
        run: |
          python -m py_compile gui/*.py
          python -m compileall -q mt3
          bash -n gui/*.sh packaging/*.sh
          # 检查只在 macOS 上炸的写法：$VAR 紧跟中文（bash 3.2 变量名）、${ 后换行。
          python packaging/check-shell.py
      - name: Post-process selftest (needs only mido)
        run: |
          python -m pip install --quiet 'mido>=1.3'
          python gui/midi_rearrange.py --selftest
      - name: WebUI selftest (no model needed)
        run: |
          python -m pip install --quiet 'mido>=1.3' fastapi uvicorn \
            python-multipart httpx soundfile
          python gui/webui/selftest.py
      - name: Install script dry-run
        run: |
          # 每个分支都要解析出正确的包名；不支持的组合必须非零退出。
          for distro in debian fedora; do
            MT3_TEST_OS=Linux MT3_TEST_DISTRO=$distro MT3_TEST_ARCH=x86_64 \
              bash packaging/install.sh --dry-run --no-probe --version 0.0.0 \
              | tee "/tmp/install-$distro.txt"
          done
          grep -q 'mt3-transcriber_0.0.0_amd64.deb' /tmp/install-debian.txt
          grep -q 'mt3-transcriber-0.0.0-1.x86_64.rpm' /tmp/install-fedora.txt
          grep -q 'GitHub 直连（--no-probe）' /tmp/install-debian.txt
          if grep -q '各取 256 KB' /tmp/install-debian.txt; then
            echo '--no-probe 不应该测速' >&2; exit 1
          fi

          MT3_TEST_OS=Darwin MT3_TEST_ARCH=arm64 MT3_TEST_MACOS=13 \
            bash packaging/install.sh --dry-run --no-probe --version 0.0.0 \
            | tee /tmp/install-macos.txt
          grep -q 'mt3-transcriber-0.0.0-arm64.dmg' /tmp/install-macos.txt

          # 显式 --mirror：不测速，URL 直接用给定前缀。
          MT3_TEST_OS=Linux MT3_TEST_DISTRO=fedora MT3_TEST_ARCH=x86_64 \
            bash packaging/install.sh --dry-run --mirror https://gh-proxy.com/ \
            --version 0.0.0 | tee /tmp/install-mirror.txt
          grep -q 'https://gh-proxy.com/https://github.com/404-GCross/mt3/releases' \
            /tmp/install-mirror.txt
          if grep -q '各取 256 KB' /tmp/install-mirror.txt; then
            echo '--mirror 不应该测速' >&2; exit 1
          fi

          if MT3_TEST_OS=Darwin MT3_TEST_ARCH=x86_64 MT3_TEST_MACOS=13 \
               bash packaging/install.sh --dry-run --no-probe --version 0.0.0; then
            echo 'Intel Mac 应该被拒绝' >&2; exit 1
          fi
          if MT3_TEST_OS=Linux MT3_TEST_DISTRO=fedora MT3_TEST_ARCH=aarch64 \
               bash packaging/install.sh --dry-run --no-probe --version 0.0.0; then
            echo 'Linux arm64 应该被拒绝' >&2; exit 1
          fi
      - name: Check downloader
        run: python gui/download_checkpoints.py --models ismir2021 --list

  tcltk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tcl/Tk build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config zlib1g-dev \
            libx11-dev libxss-dev libxext-dev libxft-dev libfontconfig1-dev \
            libxrender-dev
      - name: Build Xft-capable Tcl/Tk
        run: |
          bash packaging/build-tcltk.sh "$PWD/.tcltk"
          # Record what we built, then package it for the other jobs.
          find .tcltk/lib -maxdepth 1 -name 'libtcl*tk*' -o -maxdepth 1 -name 'libtcl9*'
          tar -czf tcltk-prefix.tar.gz -C .tcltk .
      - uses: actions/upload-artifact@v4
        with:
          name: mt3-tcltk
          path: tcltk-prefix.tar.gz
          retention-days: 14

  runtime:
    # 离线运行时（Python + CPU 依赖）体积大、构建慢，单独跑一次给 deb/rpm 复用。
    needs: [test]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build offline runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in [0-9]*) ;; *) VERSION="0.0.0" ;; esac
          VERSION="$VERSION" bash packaging/build-runtime.sh
      - name: Verify the runtime survives a move
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/home"
          tar --zstd -xf dist/mt3-runtime-*.tar.zst -C "$tmp/home"
          bash gui/runtime_repair.sh "$tmp/home"
          "$tmp/home/venv/bin/python" ./gui/import_check.py
          "$tmp/home/venv/bin/python" ./gui/midi_rearrange.py --selftest
          rm -rf "$tmp"
      - uses: actions/upload-artifact@v4
        with:
          name: mt3-runtime
          path: dist/mt3-runtime-*.tar.zst
          retention-days: 7

  checkpoints:
    # 模型权重（约 328MB），deb/rpm 内置，装完即可离线使用。
    needs: [test]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download checkpoints from the public bucket
        run: python gui/download_checkpoints.py --dir .checkpoints --source gcs
      - name: Pack checkpoints
        run: tar -cf checkpoints.tar -C .checkpoints .
      - uses: actions/upload-artifact@v4
        with:
          name: mt3-checkpoints
          path: checkpoints.tar
          retention-days: 7

  deb:
    needs: [test, tcltk, runtime, checkpoints]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mt3-tcltk
      - uses: actions/download-artifact@v4
        with:
          name: mt3-runtime
      - uses: actions/download-artifact@v4
        with:
          name: mt3-checkpoints
      - name: Extract Tcl/Tk and checkpoints
        run: |
          mkdir -p .tcltk .checkpoints
          tar -xzf tcltk-prefix.tar.gz -C .tcltk
          tar -xf checkpoints.tar -C .checkpoints
      - name: Build Debian package
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot zstd
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in [0-9]*) ;; *) VERSION="0.0.0" ;; esac
          runtime_tarball=(mt3-runtime*.tar.zst)
          test -f "${runtime_tarball[0]}" || { echo "找不到运行时 tar.zst"; exit 1; }
          RUNTIME_TARBALL="$PWD/${runtime_tarball[0]}" \
          CHECKPOINTS_DIR="$PWD/.checkpoints" \
          TCLTK_DIR="$PWD/.tcltk" VERSION="$VERSION" bash packaging/build-deb.sh
          ls -lh dist/
      - name: Verify the package ships the offline payload
        run: |
          set -euo pipefail
          listing="$(dpkg-deb -c dist/*.deb)"
          depends="$(dpkg-deb -f dist/*.deb Depends)"
          case "$listing" in *runtime.tar.zst*) ;; *) echo "缺少 runtime.tar.zst"; exit 1 ;; esac
          case "$listing" in *checkpoints/mt3/checkpoint*) ;; *) echo "缺少 mt3 权重"; exit 1 ;; esac
          case "$listing" in *checkpoints/ismir2021/checkpoint*) ;; *) echo "缺少 ismir2021 权重"; exit 1 ;; esac
          case "$listing" in *mt3-transcriber/VERSION*) ;; *) echo "缺少 VERSION"; exit 1 ;; esac
          case "$depends" in *zstd*) ;; *) echo "Depends 缺 zstd"; exit 1 ;; esac
          # 内置运行时必须是真货（>100MB），不是空壳。
          size="$(dpkg-deb -c dist/*.deb | awk '/runtime\.tar\.zst$/ {print $3}')"
          test "${size:-0}" -gt 100000000
          echo "runtime.tar.zst: $((size / 1024 / 1024)) MiB"
      - uses: actions/upload-artifact@v4
        with:
          name: mt3-transcriber-deb
          path: dist/*.deb
          compression-level: 0

  rpm:
    needs: [test, tcltk, runtime, checkpoints]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mt3-tcltk
      - uses: actions/download-artifact@v4
        with:
          name: mt3-runtime
      - uses: actions/download-artifact@v4
        with:
          name: mt3-checkpoints
      - name: Extract Tcl/Tk and checkpoints
        run: |
          mkdir -p .tcltk .checkpoints
          tar -xzf tcltk-prefix.tar.gz -C .tcltk
          tar -xf checkpoints.tar -C .checkpoints
      - name: Build RPM package
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm bash coreutils zstd
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in [0-9]*) ;; *) VERSION="0.0.0" ;; esac
          runtime_tarball=(mt3-runtime*.tar.zst)
          test -f "${runtime_tarball[0]}" || { echo "找不到运行时 tar.zst"; exit 1; }
          RUNTIME_TARBALL="$PWD/${runtime_tarball[0]}" \
          CHECKPOINTS_DIR="$PWD/.checkpoints" \
          TCLTK_DIR="$PWD/.tcltk" VERSION="$VERSION" bash packaging/build-rpm.sh
          ls -lh dist/
      - name: Verify the package ships the offline payload
        run: |
          set -euo pipefail
          listing="$(rpm -qpl dist/*.rpm)"
          requires="$(rpm -qp --requires dist/*.rpm)"
          installed="$(rpm -qp --qf '%{SIZE}' dist/*.rpm 2>/dev/null || true)"
          installed="${installed//[^0-9]/}"
          pkgbytes="$(stat -c %s dist/*.rpm)"
          case "$listing" in *runtime.tar.zst*) ;; *) echo "缺少 runtime.tar.zst"; exit 1 ;; esac
          case "$listing" in *checkpoints/mt3/checkpoint*) ;; *) echo "缺少 mt3 权重"; exit 1 ;; esac
          case "$listing" in *checkpoints/ismir2021/checkpoint*) ;; *) echo "缺少 ismir2021 权重"; exit 1 ;; esac
          case "$listing" in */VERSION*) ;; *) echo "缺少 VERSION"; exit 1 ;; esac
          case "$requires" in *zstd*) ;; *) echo "Requires 缺 zstd"; exit 1 ;; esac
          # payload 必须是真的：运行时 755MB + 两个权重 331MB（阈值放宽到 500MB）。
          # 安装体积（%{SIZE}）与包体积取其一达标即可，避免单一查询格式出问题。
          if [ "${installed:-0}" -le 500000000 ] && [ "${pkgbytes:-0}" -le 500000000 ]; then
            echo "payload 体积异常：installed=${installed:-0} package=${pkgbytes:-0}"
            exit 1
          fi
          echo "安装体积: ${installed:-?} bytes / 包体积: $((pkgbytes / 1024 / 1024)) MiB"
          # 文件级大小仅供参考。
          rpm -qp --dump dist/*.rpm | awk '$1 ~ /runtime\.tar\.zst$/ {print "runtime.tar.zst: " $2 " bytes"}' || true
      - uses: actions/upload-artifact@v4
        with:
          name: mt3-transcriber-rpm
          path: dist/*.rpm
          compression-level: 0

  appimage:
    needs: [test, tcltk]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mt3-tcltk
      - name: Extract Tcl/Tk
        run: mkdir -p .tcltk && tar -xzf tcltk-prefix.tar.gz -C .tcltk
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates file xvfb fonts-noto-cjk \
            libx11-6 libxft2 libfontconfig1 libfreetype6 libxrender1 \
            libxss1 libxext6 libxcb1 libxau6 libxdmcp6
      - name: Build AppImage
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in [0-9]*) ;; *) VERSION="0.0.0" ;; esac
          TCLTK_DIR="$PWD/.tcltk" VERSION="$VERSION" bash packaging/build-appimage.sh
      - name: Smoke test the AppImage dependencies
        run: |
          set -euo pipefail
          appdir="$PWD/.appimage/MT3Transcriber.AppDir"
          "$appdir/usr/venv/bin/python" \
            "$appdir/usr/share/mt3-transcriber/gui/import_check.py"
      - name: Smoke test CJK fonts in AppImage
        run: |
          set -euo pipefail
          appimage="$(ls dist/*.AppImage)"
          "$appimage" --appimage-extract >/dev/null
          appdir="$PWD/squashfs-root"
          test -n "$(find "$appdir/usr/share/fonts" -type f \
            \( -name '*.ttc' -o -name '*.otf' -o -name '*.ttf' \) -print -quit)"
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/cache"
          cat > "$tmp/fonts.conf" <<XML
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <dir>$appdir/usr/share/fonts</dir>
            <cachedir>$tmp/cache</cachedir>
          </fontconfig>
          XML
          FONTCONFIG_FILE="$tmp/fonts.conf" xvfb-run -a "$appdir/AppRun" --check-fonts
      - uses: actions/upload-artifact@v4
        with:
          name: mt3-transcriber-appimage
          path: dist/*.AppImage
          retention-days: 14

  docker:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: mt3-transcriber:${{ github.sha }}
          push: false

  macos:
    # macOS（Apple Silicon）应用包：.app + .dmg，包内自带 Python、依赖与两个模型权重。
    needs: [test, checkpoints]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mt3-checkpoints
      - name: Extract checkpoints
        run: |
          mkdir -p .checkpoints
          tar -xf checkpoints.tar -C .checkpoints
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/uv-cache
          key: uv-macos-${{ hashFiles('setup.py') }}
      - name: Build MT3 Transcriber.app and the dmg
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in [0-9]*) ;; *) VERSION="0.0.0" ;; esac
          VERSION="$VERSION" CHECKPOINTS_DIR="$PWD/.checkpoints" \
            bash packaging/build-macos.sh
          ls -lh dist/
      - name: Verify the bundle (moved app + read-only dmg)
        run: bash packaging/verify-macos.sh dist/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: mt3-transcriber-macos
          path: dist/*.dmg
          retention-days: 14
          compression-level: 0

  install-script:
    name: Install script (${{ matrix.image }})
    needs: [deb, rpm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12
            artifact: deb
          - image: fedora:40
            artifact: rpm
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mt3-transcriber-${{ matrix.artifact }}
          path: dist
      - name: Install inside ${{ matrix.image }} and probe the WebUI
        run: |
          docker run --rm \
            -v "$PWD":/work -w /work \
            "${{ matrix.image }}" \
            bash -c '
              set -e
              if command -v apt-get >/dev/null 2>&1; then
                export DEBIAN_FRONTEND=noninteractive
                apt-get update -qq
                apt-get install -y -qq curl
              else
                dnf install -y -q curl
              fi
              pkg=$(ls dist/*.deb dist/*.rpm 2>/dev/null | head -1)
              echo "安装 $pkg"
              bash packaging/install.sh --file "$pkg" --yes
              mt3-transcriber --help >/dev/null
              mt3-transcriber --web --port 18999 --token ci-token \
                >/tmp/web.log 2>&1 &
              for i in $(seq 1 180); do
                if curl -fsS http://127.0.0.1:18999/api/health >/dev/null 2>&1; then
                  curl -fsS http://127.0.0.1:18999/api/health
                  exit 0
                fi
                sleep 1
              done
              echo "WebUI 没起来" >&2
              cat /tmp/web.log >&2 || true
              exit 1
            '

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb, rpm, appimage, macos, install-script]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: mt3-transcriber-*
      - uses: actions/download-artifact@v4
        with:
          path: dist
          name: mt3-tcltk
      - name: Checksums
        run: |
          # 随包 Tcl/Tk（带 Xft）也发布出去，方便手动修复已有 venv。
          if [ -f dist/tcltk-prefix.tar.gz ]; then
            mv dist/tcltk-prefix.tar.gz dist/mt3-transcriber-tcltk.tar.gz
          fi
          # 一键安装脚本作为资产发布：.../releases/latest/download/install.sh
          cp packaging/install.sh dist/install.sh
          sha256sum dist/* > dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
