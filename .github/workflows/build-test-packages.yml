name: Build test packages

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python and validate shell scripts
        run: |
          python -m py_compile gui/*.py
          python -m compileall -q mt3
          bash -n gui/*.sh packaging/*.sh
      - name: Post-process selftest (needs only mido)
        run: |
          python -m pip install --quiet 'mido>=1.3'
          python gui/midi_rearrange.py --selftest

  tcltk:
    name: Build Xft Tcl/Tk
    needs: checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tcl/Tk build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config zlib1g-dev \
            libx11-dev libxss-dev libxext-dev libxft-dev libfontconfig1-dev \
            libxrender-dev
      - name: Build Xft-capable Tcl/Tk
        run: |
          bash packaging/build-tcltk.sh "$PWD/.tcltk"
          tar -czf tcltk-prefix.tar.gz -C .tcltk .
      - uses: actions/upload-artifact@v4
        with:
          name: mt3-tcltk-${{ github.sha }}
          path: tcltk-prefix.tar.gz
          retention-days: 14

  runtime:
    name: Build offline runtime
    needs: checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime (Python + CPU deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          VERSION=0.0.0 bash packaging/build-runtime.sh
      - name: Verify the runtime survives a move
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/home"
          tar --zstd -xf dist/mt3-runtime-*.tar.zst -C "$tmp/home"
          bash gui/runtime_repair.sh "$tmp/home"
          "$tmp/home/venv/bin/python" ./gui/import_check.py
          "$tmp/home/venv/bin/python" ./gui/midi_rearrange.py --selftest
          rm -rf "$tmp"
      - uses: actions/upload-artifact@v4
        with:
          name: mt3-runtime-${{ github.sha }}
          path: dist/mt3-runtime-*.tar.zst
          retention-days: 14

  checkpoints:
    name: Fetch model checkpoints
    needs: checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download checkpoints
        run: python gui/download_checkpoints.py --dir .checkpoints --source gcs
      - name: Pack checkpoints
        run: tar -cf checkpoints.tar -C .checkpoints .
      - uses: actions/upload-artifact@v4
        with:
          name: mt3-checkpoints-${{ github.sha }}
          path: checkpoints.tar
          retention-days: 14

  build-deb:
    name: Build Debian package
    needs: [checks, tcltk, runtime, checkpoints]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mt3-tcltk-${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: mt3-runtime-${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: mt3-checkpoints-${{ github.sha }}
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot zstd
      - name: Extract Tcl/Tk and checkpoints
        run: |
          mkdir -p .tcltk .checkpoints
          tar -xzf tcltk-prefix.tar.gz -C .tcltk
          tar -xf checkpoints.tar -C .checkpoints
      - name: Build package
        run: |
          runtime_tarball=(mt3-runtime*.tar.zst)
          test -f "${runtime_tarball[0]}" || { echo "找不到运行时 tar.zst"; exit 1; }
          RUNTIME_TARBALL="$PWD/${runtime_tarball[0]}" \
          CHECKPOINTS_DIR="$PWD/.checkpoints" \
          TCLTK_DIR="$PWD/.tcltk" VERSION=0.0.0 bash packaging/build-deb.sh
          ls -lh dist/
      - name: Inspect package
        run: dpkg-deb --info dist/*.deb
      - name: Verify the package ships the offline payload
        run: |
          set -euo pipefail
          listing="$(dpkg-deb -c dist/*.deb)"
          depends="$(dpkg-deb -f dist/*.deb Depends)"
          case "$listing" in *runtime.tar.zst*) ;; *) echo "缺少 runtime.tar.zst"; exit 1 ;; esac
          case "$listing" in *checkpoints/mt3/checkpoint*) ;; *) echo "缺少 mt3 权重"; exit 1 ;; esac
          case "$listing" in *checkpoints/ismir2021/checkpoint*) ;; *) echo "缺少 ismir2021 权重"; exit 1 ;; esac
          case "$listing" in *mt3-transcriber/VERSION*) ;; *) echo "缺少 VERSION"; exit 1 ;; esac
          case "$depends" in *zstd*) ;; *) echo "Depends 缺 zstd"; exit 1 ;; esac
          # 内置运行时必须是真货（>100MB），不是空壳。
          size="$(dpkg-deb -c dist/*.deb | awk '/runtime\.tar\.zst$/ {print $3}')"
          test "${size:-0}" -gt 100000000
          echo "runtime.tar.zst: $((size / 1024 / 1024)) MiB"
      - uses: actions/upload-artifact@v4
        with:
          name: mt3-transcriber-deb-${{ github.sha }}
          path: dist/*.deb
          retention-days: 14
          compression-level: 0

  build-rpm:
    name: Build RPM package
    needs: [checks, tcltk, runtime, checkpoints]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mt3-tcltk-${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: mt3-runtime-${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: mt3-checkpoints-${{ github.sha }}
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm zstd
      - name: Extract Tcl/Tk and checkpoints
        run: |
          mkdir -p .tcltk .checkpoints
          tar -xzf tcltk-prefix.tar.gz -C .tcltk
          tar -xf checkpoints.tar -C .checkpoints
      - name: Build package
        run: |
          runtime_tarball=(mt3-runtime*.tar.zst)
          test -f "${runtime_tarball[0]}" || { echo "找不到运行时 tar.zst"; exit 1; }
          RUNTIME_TARBALL="$PWD/${runtime_tarball[0]}" \
          CHECKPOINTS_DIR="$PWD/.checkpoints" \
          TCLTK_DIR="$PWD/.tcltk" VERSION=0.0.0 bash packaging/build-rpm.sh
          ls -lh dist/
      - name: Verify the package ships the offline payload
        run: |
          set -euo pipefail
          listing="$(rpm -qpl dist/*.rpm)"
          requires="$(rpm -qp --requires dist/*.rpm)"
          installed="$(rpm -qp --qf '%{SIZE}' dist/*.rpm 2>/dev/null || true)"
          installed="${installed//[^0-9]/}"
          pkgbytes="$(stat -c %s dist/*.rpm)"
          case "$listing" in *runtime.tar.zst*) ;; *) echo "缺少 runtime.tar.zst"; exit 1 ;; esac
          case "$listing" in *checkpoints/mt3/checkpoint*) ;; *) echo "缺少 mt3 权重"; exit 1 ;; esac
          case "$listing" in *checkpoints/ismir2021/checkpoint*) ;; *) echo "缺少 ismir2021 权重"; exit 1 ;; esac
          case "$listing" in */VERSION*) ;; *) echo "缺少 VERSION"; exit 1 ;; esac
          case "$requires" in *zstd*) ;; *) echo "Requires 缺 zstd"; exit 1 ;; esac
          # payload 必须是真的：运行时 755MB + 两个权重 331MB（阈值放宽到 500MB）。
          # 安装体积（%{SIZE}）与包体积取其一达标即可，避免单一查询格式出问题。
          if [ "${installed:-0}" -le 500000000 ] && [ "${pkgbytes:-0}" -le 500000000 ]; then
            echo "payload 体积异常：installed=${installed:-0} package=${pkgbytes:-0}"
            exit 1
          fi
          echo "安装体积: ${installed:-?} bytes / 包体积: $((pkgbytes / 1024 / 1024)) MiB"
          # 文件级大小仅供参考。
          rpm -qp --dump dist/*.rpm | awk '$1 ~ /runtime\.tar\.zst$/ {print "runtime.tar.zst: " $2 " bytes"}' || true
      - uses: actions/upload-artifact@v4
        with:
          name: mt3-transcriber-rpm-${{ github.sha }}
          path: dist/*.rpm
          retention-days: 14
          compression-level: 0

  build-docker:
    name: Build Docker image
    needs: checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: mt3-transcriber:test-${{ github.sha }}
          push: false
