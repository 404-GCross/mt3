name: Build test packages

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python and validate shell scripts
        run: |
          python -m py_compile gui/*.py
          python -m compileall -q mt3
          bash -n gui/*.sh packaging/*.sh

  tcltk:
    name: Build Xft Tcl/Tk
    needs: checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tcl/Tk build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config zlib1g-dev \
            libx11-dev libxss-dev libxext-dev libxft-dev libfontconfig1-dev \
            libxrender-dev
      - name: Build Xft-capable Tcl/Tk
        run: |
          bash packaging/build-tcltk.sh "$PWD/.tcltk"
          tar -czf tcltk-prefix.tar.gz -C .tcltk .
      - uses: actions/upload-artifact@v4
        with:
          name: mt3-tcltk-${{ github.sha }}
          path: tcltk-prefix.tar.gz
          retention-days: 14

  runtime:
    name: Build offline runtime
    needs: checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime (Python + CPU deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          VERSION=0.0.0 bash packaging/build-runtime.sh
      - name: Verify the runtime survives a move
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/home"
          tar --zstd -xf dist/mt3-runtime-*.tar.zst -C "$tmp/home"
          bash gui/runtime_repair.sh "$tmp/home"
          "$tmp/home/venv/bin/python" ./gui/import_check.py
          rm -rf "$tmp"
      - uses: actions/upload-artifact@v4
        with:
          name: mt3-runtime-${{ github.sha }}
          path: dist/mt3-runtime-*.tar.zst
          retention-days: 14

  checkpoints:
    name: Fetch model checkpoints
    needs: checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download checkpoints
        run: python gui/download_checkpoints.py --dir .checkpoints --source gcs
      - name: Pack checkpoints
        run: tar -cf checkpoints.tar -C .checkpoints .
      - uses: actions/upload-artifact@v4
        with:
          name: mt3-checkpoints-${{ github.sha }}
          path: checkpoints.tar
          retention-days: 14

  build-deb:
    name: Build Debian package
    needs: [checks, tcltk, runtime, checkpoints]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mt3-tcltk-${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: mt3-runtime-${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: mt3-checkpoints-${{ github.sha }}
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot zstd
      - name: Extract Tcl/Tk and checkpoints
        run: |
          mkdir -p .tcltk .checkpoints
          tar -xzf tcltk-prefix.tar.gz -C .tcltk
          tar -xf checkpoints.tar -C .checkpoints
      - name: Build package
        run: |
          RUNTIME_TARBALL="$PWD/$(ls mt3-runtime*.tar.zst | head -1)" \
          CHECKPOINTS_DIR="$PWD/.checkpoints" \
          TCLTK_DIR="$PWD/.tcltk" VERSION=0.0.0 bash packaging/build-deb.sh
          ls -lh dist/
      - name: Inspect package
        run: dpkg-deb --info dist/*.deb
      - name: Verify the package ships the offline payload
        run: |
          set -euo pipefail
          listing="$(dpkg-deb -c dist/*.deb)"
          printf '%s\n' "$listing" | grep -q 'runtime\.tar\.zst$'
          printf '%s\n' "$listing" | grep -q 'checkpoints/mt3/checkpoint$'
          printf '%s\n' "$listing" | grep -q 'checkpoints/ismir2021/checkpoint$'
          printf '%s\n' "$listing" | grep -q '\./usr/share/mt3-transcriber/VERSION$'
          # 内置运行时必须是真货（>100MB），不是空壳。
          size="$(printf '%s\n' "$listing" | awk '/runtime\.tar\.zst$/ {print $3}')"
          test "${size:-0}" -gt 100000000
          echo "runtime.tar.zst: $((size / 1024 / 1024)) MiB"
          dpkg-deb -f dist/*.deb Depends | tr ',' '\n' | grep -q zstd
      - uses: actions/upload-artifact@v4
        with:
          name: mt3-transcriber-deb-${{ github.sha }}
          path: dist/*.deb
          retention-days: 14
          compression-level: 0

  build-rpm:
    name: Build RPM package
    needs: [checks, tcltk, runtime, checkpoints]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mt3-tcltk-${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: mt3-runtime-${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: mt3-checkpoints-${{ github.sha }}
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm zstd
      - name: Extract Tcl/Tk and checkpoints
        run: |
          mkdir -p .tcltk .checkpoints
          tar -xzf tcltk-prefix.tar.gz -C .tcltk
          tar -xf checkpoints.tar -C .checkpoints
      - name: Build package
        run: |
          RUNTIME_TARBALL="$PWD/$(ls mt3-runtime*.tar.zst | head -1)" \
          CHECKPOINTS_DIR="$PWD/.checkpoints" \
          TCLTK_DIR="$PWD/.tcltk" VERSION=0.0.0 bash packaging/build-rpm.sh
          ls -lh dist/
      - name: Verify the package ships the offline payload
        run: |
          set -euo pipefail
          listing="$(rpm -qpl dist/*.rpm)"
          printf '%s\n' "$listing" | grep -q 'runtime\.tar\.zst$'
          printf '%s\n' "$listing" | grep -q 'checkpoints/mt3/checkpoint$'
          printf '%s\n' "$listing" | grep -q 'checkpoints/ismir2021/checkpoint$'
          printf '%s\n' "$listing" | grep -q '/VERSION$'
          rpm -qp --requires dist/*.rpm | grep -q '^zstd'
          # 内置运行时必须是真货（>100MB），不是空壳。
          size="$(rpm -qp --qf '[%{FILENAMES}\t%{FILESIZES}\n]' dist/*.rpm \
            | awk -F'\t' '/runtime\.tar\.zst$/ {print $2}')"
          test "${size:-0}" -gt 100000000
          echo "runtime.tar.zst: $((size / 1024 / 1024)) MiB"
      - uses: actions/upload-artifact@v4
        with:
          name: mt3-transcriber-rpm-${{ github.sha }}
          path: dist/*.rpm
          retention-days: 14
          compression-level: 0

  build-docker:
    name: Build Docker image
    needs: checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: mt3-transcriber:test-${{ github.sha }}
          push: false
